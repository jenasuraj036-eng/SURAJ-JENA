  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🐦 BirdClassifier · Deep Learning</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="./🐦 BirdClassifier · Deep Learning_files/all.min.css">
  <style>
    /* ----- global reset & fonts ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0b1a1e 0%, #1e3a3f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      padding: 24px;
    }

    /* ----- main card (glassmorphism) ----- */
    .bird-card {
      max-width: 1000px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 56px;
      padding: 34px 32px 40px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 30px 60px -16px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.02);
      transition: 0.2s;
    }

    /* ----- header ----- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 28px;
    }

    .header h1 {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
      font-size: 2.1rem;
      color: #f0f9ff;
      letter-spacing: -0.3px;
    }

    .header h1 i {
      color: #facc15;
      font-size: 2.3rem;
      filter: drop-shadow(0 0 10px #facc1580);
    }

    .badge-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(4px);
      padding: 8px 20px;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-weight: 500;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge i {
      color: #facc15;
    }

    /* ----- main grid: image + prediction ----- */
    .recognition-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      margin: 10px 0 28px;
    }

    @media (max-width: 720px) {
      .recognition-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    /* ---- image panel (simulated) ---- */
    .image-panel {
      background: #0c1c22;
      border-radius: 40px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .image-panel .bird-illustration {
      font-size: 7rem;
      color: #e2e8f0;
      opacity: 0.7;
      transition: 0.3s;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
      line-height: 1;
    }

    .image-panel .bird-label {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 6px 24px;
      border-radius: 60px;
      font-size: 0.9rem;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.04);
      font-weight: 500;
      white-space: nowrap;
    }

    .image-panel .bird-label i {
      margin-right: 10px;
      color: #facc15;
    }

    /* ---- prediction panel ---- */
    .prediction-panel {
      background: rgba(12, 28, 34, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 24px 22px 22px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .prediction-header {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #94a3b8;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      margin-bottom: 16px;
    }

    .prediction-header i {
      color: #facc15;
      font-size: 1.2rem;
    }

    .result-box {
      background: #0a1a1f;
      border-radius: 32px;
      padding: 28px 20px 20px;
      border: 1px solid #2b4047;
      box-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.4);
      margin-bottom: 18px;
      text-align: center;
    }

    .bird-name-large {
      font-size: 3rem;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.2;
      letter-spacing: 1px;
    }

    .bird-name-large .sci-name {
      font-size: 1.1rem;
      font-weight: 400;
      color: #94a3b8;
      display: block;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .confidence-wrapper {
      margin-top: 16px;
    }

    .confidence-track {
      background: #1f323a;
      border-radius: 60px;
      height: 10px;
      width: 100%;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #facc15, #f59e0b);
      border-radius: 60px;
      transition: width 0.35s ease;
    }

    .confidence-label {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 500;
      margin-top: 6px;
    }

    /* top-3 list */
    .top-list {
      margin-top: 6px;
    }

    .top-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      color: #d1dce5;
      font-size: 0.95rem;
    }

    .top-item:last-child {
      border-bottom: none;
    }

    .top-item .label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-item .label i {
      color: #4b6b74;
      width: 20px;
      font-size: 0.9rem;
    }

    .top-item .prob {
      background: #1e353e;
      padding: 0 16px;
      border-radius: 60px;
      font-weight: 600;
      color: #facc15;
      font-size: 0.8rem;
      line-height: 1.8;
    }

    /* ----- action bar (history + buttons) ----- */
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 60px;
      padding: 12px 18px 12px 26px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      margin-top: 8px;
    }

    .history-badge {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #b9cdd6;
      font-weight: 500;
      font-size: 0.9rem;
      flex-wrap: wrap;
    }

    .history-badge i {
      color: #facc15;
    }

    .history-chips {
      display: flex;
      gap: 8px;
    }

    .chip {
      background: #1c333c;
      padding: 2px 16px;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e8f0f3;
      border: 1px solid #2d4a54;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: transparent;
      border: 1px solid #3a565f;
      color: #e2e8f0;
      padding: 8px 20px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.15s;
      backdrop-filter: blur(4px);
    }

    .btn-primary {
      background: #facc15;
      border: 1px solid #facc15;
      color: #0b1a1e;
    }

    .btn-primary:hover {
      background: #fde047;
      border-color: #fde047;
      transform: scale(1.02);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: #7a9aa6;
    }

    .btn:active {
      transform: scale(0.94);
    }

    .btn i {
      font-size: 0.9rem;
    }

    /* ----- footer ----- */
    .footer-meta {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
      color: #4d6f7a;
      font-size: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      padding-top: 24px;
    }

    .footer-meta span i {
      margin-right: 8px;
      color: #facc15;
    }

    /* responsive */
    @media (max-width: 480px) {
      .bird-card { padding: 20px; }
      .header h1 { font-size: 1.7rem; }
      .bird-name-large { font-size: 2.2rem; }
      .action-bar { flex-direction: column; align-items: stretch; }
      .btn-group { justify-content: center; }
      .history-badge { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="bird-card">
    <!-- header -->
    <div class="header">
      <h1>
        <i class="fas fa-crow"></i> 
        BirdClass
      </h1>
      <div class="badge-group">
        <span class="badge"><i class="fas fa-microchip"></i> ResNet50 · fine-tuned</span>
        <span class="badge"><i class="fas fa-database"></i> 200 species</span>
      </div>
    </div>

    <!-- main grid -->
    <div class="recognition-grid">
      <!-- image panel (simulated) -->
      <div class="image-panel" id="imagePanel">
        <div class="bird-illustration" id="birdEmoji">🦅</div>
        <div class="bird-label">
          <i class="fas fa-camera"></i> 
          <span id="imageLabel">Golden Eagle</span>
        </div>
      </div>

      <!-- prediction panel -->
      <div class="prediction-panel">
        <div class="prediction-header">
          <i class="fas fa-brain"></i> 
          <span>inference · top prediction</span>
        </div>

        <div class="result-box">
          <div class="bird-name-large" id="mainBirdName">Golden Eagle <span class="sci-name" id="sciName">Aquila chrysaetos</span></div>
          <div class="confidence-wrapper">
            <div class="confidence-track">
              <div class="confidence-fill" id="confidenceFill" style="width: 64.7848%;"></div>
            </div>
            <div class="confidence-label">
              <span>confidence</span>
              <span id="confidenceText">65%</span>
            </div>
          </div>
        </div>

        <!-- top 3 -->
        <div class="top-list" id="topList"><div class="top-item">
            <span class="label"><i class="fas fa-crow"></i> Golden Eagle</span>
            <span class="prob">65%</span>
          </div><div class="top-item">
            <span class="label"><i class="fas fa-dove"></i> Peregrine Falcon</span>
            <span class="prob">7%</span>
          </div><div class="top-item">
            <span class="label"><i class="fas fa-kiwi-bird"></i> American Kestrel</span>
            <span class="prob">28%</span>
          </div></div>
      </div>
    </div>

    <!-- action bar -->
    <div class="action-bar">
      <div class="history-badge">
        <i class="fas fa-history"></i> 
        <span>recent</span>
        <div class="history-chips" id="historyChips"><span class="chip">🦉</span><span class="chip">🐦</span><span class="chip">🦅</span><span class="chip">🦉</span><span class="chip">🦅</span></div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" id="nextBtn"><i class="fas fa-arrow-right"></i> next species</button>
        <button class="btn btn-outline" id="resetBtn"><i class="fas fa-undo-alt"></i> reset</button>
      </div>
    </div>

    <!-- footer -->
    <div class="footer-meta">
      <span><i class="fas fa-tree"></i> trained on 50k+ images</span>
      <span><i class="fas fa-chart-simple"></i> top-1 acc 87.6%</span>
      <span><i class="fas fa-code"></i> PyTorch · Grad-CAM</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ----- BIRD DATASET (simulated) -----
      const BIRD_SPECIES = [
        { id: 0, common: 'Bald Eagle', scientific: 'Haliaeetus leucocephalus', emoji: '🦅' },
        { id: 1, common: 'Osprey', scientific: 'Pandion haliaetus', emoji: '🦉' },
        { id: 2, common: 'Golden Eagle', scientific: 'Aquila chrysaetos', emoji: '🦅' },
        { id: 3, common: 'Peregrine Falcon', scientific: 'Falco peregrinus', emoji: '🐦' },
        { id: 4, common: 'Snowy Owl', scientific: 'Bubo scandiacus', emoji: '🦉' },
        { id: 5, common: 'Red-tailed Hawk', scientific: 'Buteo jamaicensis', emoji: '🦅' },
        { id: 6, common: 'Great Horned Owl', scientific: 'Bubo virginianus', emoji: '🦉' },
        { id: 7, common: 'American Kestrel', scientific: 'Falco sparverius', emoji: '🐦' },
        { id: 8, common: 'California Condor', scientific: 'Gymnogyps californianus', emoji: '🦅' },
        { id: 9, common: 'Turkey Vulture', scientific: 'Cathartes aura', emoji: '🐦' },
        { id: 10, common: 'Swallow-tailed Kite', scientific: 'Elanoides forficatus', emoji: '🐦' },
        { id: 11, common: 'White-tailed Eagle', scientific: 'Haliaeetus albicilla', emoji: '🦅' }
      ];

      // ----- DOM refs -----
      const birdEmoji = document.getElementById('birdEmoji');
      const imageLabel = document.getElementById('imageLabel');
      const mainBirdName = document.getElementById('mainBirdName');
      const sciName = document.getElementById('sciName');
      const confidenceFill = document.getElementById('confidenceFill');
      const confidenceText = document.getElementById('confidenceText');
      const topList = document.getElementById('topList');
      const historyChips = document.getElementById('historyChips');

      const nextBtn = document.getElementById('nextBtn');
      const resetBtn = document.getElementById('resetBtn');

      // ----- state -----
      let currentPrediction = null;       // { top, top3, confidence }
      let history = [];                  // emojis (max 5)

      // helper: pick random distinct birds (with bias)
      function getRandomPrediction() {
        const total = BIRD_SPECIES.length;
        // pick top index
        let topIdx = Math.floor(Math.random() * total);
        // ensure variety: bias toward less recent if history exists
        if (history.length > 0) {
          const lastEmoji = history[history.length - 1];
          let attempts = 0;
          while (attempts < 10 && BIRD_SPECIES[topIdx].emoji === lastEmoji) {
            topIdx = Math.floor(Math.random() * total);
            attempts++;
          }
        }

        const topBird = BIRD_SPECIES[topIdx];

        // pick two other distinct indices
        let others = [];
        let available = BIRD_SPECIES.filter((_, i) => i !== topIdx);
        for (let i = 0; i < 2; i++) {
          if (available.length === 0) break;
          const rand = Math.floor(Math.random() * available.length);
          others.push(available[rand]);
          available.splice(rand, 1);
        }
        // if not enough, fill with topIdx (fallback)
        while (others.length < 2) {
          others.push(BIRD_SPECIES[(topIdx + others.length + 1) % total]);
        }

        // generate confidences (sum 100)
        let confs = [0, 0, 0];
        let remaining = 100;
        for (let i = 0; i < 3; i++) {
          if (i === 2) {
            confs[i] = remaining;
          } else {
            let max = Math.min(remaining - 4, 75);
            let min = i === 0 ? 40 : 3;
            let val = Math.floor(Math.random() * (max - min + 1)) + min;
            if (i === 0) val = Math.min(94, Math.max(60, val));
            confs[i] = val;
            remaining -= val;
          }
        }
        // ensure top is highest
        if (confs[0] < confs[1] + 5) confs[0] = Math.min(94, confs[1] + 12);
        if (confs[0] < confs[2] + 5) confs[0] = Math.min(94, confs[2] + 15);
        // normalize to 100
        let sum = confs.reduce((a,b) => a+b, 0);
        confs = confs.map(c => Math.round((c / sum) * 100));
        let diff = 100 - confs.reduce((a,b) => a+b, 0);
        confs[0] += diff;
        if (confs[0] < 0) confs[0] = 20;
        if (confs[0] > 98) confs[0] = 98;

        const top3 = [
          { bird: topBird, confidence: confs[0] },
          { bird: others[0], confidence: confs[1] },
          { bird: others[1], confidence: confs[2] }
        ];

        return {
          top: topBird,
          top3: top3,
          topConfidence: confs[0]
        };
      }

      // ----- render UI -----
      function renderPrediction(pred) {
        if (!pred) return;

        const top = pred.top3[0];
        const bird = top.bird;

        // main bird name + scientific
        mainBirdName.innerHTML = `${bird.common} <span class="sci-name" id="sciName">${bird.scientific}</span>`;
        // image panel
        birdEmoji.textContent = bird.emoji;
        imageLabel.textContent = bird.common;

        // confidence
        confidenceFill.style.width = `${top.confidence}%`;
        confidenceText.textContent = `${top.confidence}%`;

        // top 3 list
        topList.innerHTML = '';
        const icons = ['fa-crow', 'fa-dove', 'fa-kiwi-bird'];
        pred.top3.forEach((item, idx) => {
          const div = document.createElement('div');
          div.className = 'top-item';
          div.innerHTML = `
            <span class="label"><i class="fas ${icons[idx % icons.length]}"></i> ${item.bird.common}</span>
            <span class="prob">${item.confidence}%</span>
          `;
          topList.appendChild(div);
        });

        // update history (emoji)
        history.push(bird.emoji);
        if (history.length > 5) history.shift();
        updateHistory();

        // store
        currentPrediction = pred;
      }

      function updateHistory() {
        historyChips.innerHTML = history.map(emoji => 
          `<span class="chip">${emoji}</span>`
        ).join('');
        if (history.length === 0) {
          historyChips.innerHTML = `<span class="chip" style="opacity:0.4;">—</span>`;
        }
      }

      // generate and render new prediction
      function nextPrediction() {
        const pred = getRandomPrediction();
        renderPrediction(pred);
      }

      // reset to default (Bald Eagle)
      function resetToDefault() {
        // set default prediction : Bald Eagle with high confidence
        const defaultBird = BIRD_SPECIES[0]; // Bald Eagle
        const defaultPred = {
          top: defaultBird,
          top3: [
            { bird: defaultBird, confidence: 93 },
            { bird: BIRD_SPECIES[1], confidence: 4 },
            { bird: BIRD_SPECIES[2], confidence: 3 }
          ],
          topConfidence: 93
        };
        // reset history
        history = ['🦅', '🦉', '🐦'];
        renderPrediction(defaultPred);
        // force history chips
        updateHistory();
        // set confidence fill
        confidenceFill.style.width = '93%';
        confidenceText.textContent = '93%';
      }

      // ----- auto simulate (every 4.5s) -----
      let autoInterval = null;

      function startAuto() {
        if (autoInterval) clearInterval(autoInterval);
        autoInterval = setInterval(() => {
          nextPrediction();
        }, 4500);
      }

      // ----- init -----
      function init() {
        resetToDefault();
        startAuto();

        // event listeners
        nextBtn.addEventListener('click', () => {
          nextPrediction();
          clearInterval(autoInterval);
          startAuto();
        });

        resetBtn.addEventListener('click', () => {
          resetToDefault();
          clearInterval(autoInterval);
          startAuto();
        });

        // extra: small jitter on confidence for realism (every 2s)
        setInterval(() => {
          if (currentPrediction) {
            const base = currentPrediction.topConfidence || 90;
            const jitter = Math.min(98, Math.max(55, base + (Math.random() * 8 - 4)));
            confidenceFill.style.width = `${jitter}%`;
            confidenceText.textContent = `${Math.round(jitter)}%`;
            // update top list first item
            const firstProb = topList.querySelector('.top-item .prob');
            if (firstProb) {
              firstProb.textContent = `${Math.round(jitter)}%`;
            }
          }
        }, 2200);
      }

      init();
    })();
  </script>
