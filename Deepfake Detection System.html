<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Detection System</title>
    <style>
        /* ===== CSS Variables & Reset ===== */
        :root {
            --primary: #6C63FF;
            --primary-dark: #5A52D5;
            --primary-light: #8B83FF;
            --secondary: #FF6B6B;
            --success: #51CF66;
            --warning: #FFD93D;
            --dark: #1A1A2E;
            --dark-card: #16213E;
            --dark-hover: #1F2B4A;
            --text: #E0E0E0;
            --text-muted: #8888A8;
            --border: #2A2A4A;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(108, 99, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 107, 107, 0.06) 0%, transparent 50%);
            padding: 20px;
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-light); }

        /* ===== Container ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== Header ===== */
        .header {
            text-align: center;
            padding: 40px 20px 30px;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 0.3px;
        }

        .header .badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 20px;
            background: rgba(108, 99, 255, 0.15);
            border: 1px solid rgba(108, 99, 255, 0.3);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary-light);
        }

        /* ===== Tabs ===== */
        .tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 30px 0 25px;
            background: var(--dark-card);
            padding: 6px;
            border-radius: 14px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 16px rgba(108, 99, 255, 0.3);
        }

        .tab-btn .icon {
            font-size: 1.2rem;
        }

        /* ===== Tab Content ===== */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Upload Area ===== */
        .upload-area {
            background: var(--dark-card);
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 50px 30px;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: var(--dark-hover);
        }

        .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(108, 99, 255, 0.08);
            transform: scale(1.01);
        }

        .upload-area .upload-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .upload-area h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .upload-area p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .upload-area .supported-formats {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 16px;
            border-radius: 12px;
        }

        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ===== Preview ===== */
        .preview-container {
            margin-top: 20px;
            display: none;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--dark-card);
            border: 1px solid var(--border);
        }

        .preview-container.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .preview-container img,
        .preview-container video {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            background: #0a0a1a;
            display: block;
        }

        .preview-container .preview-info {
            padding: 12px 20px;
            background: var(--dark-card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .preview-container .file-name {
            font-weight: 500;
            color: var(--text);
        }

        /* ===== Buttons ===== */
        .btn {
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 16px rgba(108, 99, 255, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(108, 99, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--dark-hover);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-danger {
            background: var(--secondary);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ===== Results ===== */
        .results-container {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .results-container.visible {
            display: block;
        }

        /* Result Card */
        .result-card {
            background: var(--dark-card);
            border-radius: var(--radius);
            padding: 28px 32px;
            border: 1px solid var(--border);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }

        .result-verdict {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .result-verdict .verdict-icon {
            font-size: 2.4rem;
        }

        .result-verdict .verdict-text {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .verdict-real .verdict-text { color: var(--success); }
        .verdict-fake .verdict-text { color: var(--secondary); }
        .verdict-unknown .verdict-text { color: var(--warning); }

        .result-confidence {
            text-align: right;
        }

        .result-confidence .confidence-value {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .result-confidence .confidence-label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* ===== Confidence Bar ===== */
        .confidence-bar-container {
            margin: 16px 0 24px;
        }

        .confidence-bar-track {
            width: 100%;
            height: 12px;
            background: var(--dark);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .confidence-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
            background: linear-gradient(90deg, var(--success), var(--warning), var(--secondary));
        }

        .confidence-bar-fill.fake {
            background: linear-gradient(90deg, var(--warning), var(--secondary));
        }

        .confidence-bar-fill.real {
            background: linear-gradient(90deg, var(--success), #4CAF50);
        }

        .confidence-bar-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ===== Metrics Grid ===== */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }

        .metric-item {
            background: var(--dark);
            padding: 16px 20px;
            border-radius: 12px;
            text-align: center;
        }

        .metric-item .metric-value {
            font-size: 1.4rem;
            font-weight: 700;
            display: block;
        }

        .metric-item .metric-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .metric-item .metric-value.good { color: var(--success); }
        .metric-item .metric-value.bad { color: var(--secondary); }
        .metric-item .metric-value.warning { color: var(--warning); }

        /* ===== Forensic Details ===== */
        .forensic-details {
            margin-top: 20px;
            background: var(--dark);
            border-radius: 12px;
            padding: 16px 20px;
        }

        .forensic-details summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 0;
        }

        .forensic-details summary:hover {
            color: var(--text);
        }

        .forensic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .forensic-item {
            background: var(--dark-card);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .forensic-item .f-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .forensic-item .f-value {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 2px;
        }

        /* ===== Spinner ===== */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--dark-card);
            color: var(--text);
            padding: 16px 28px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-weight: 500;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-color: var(--secondary);
        }

        .toast.success {
            border-color: var(--success);
        }

        /* ===== History ===== */
        .history-section {
            margin-top: 30px;
        }

        .history-section h4 {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: var(--dark);
            border-radius: 8px;
            font-size: 0.9rem;
            border-left: 3px solid var(--primary);
        }

        .history-item .h-verdict {
            font-weight: 600;
        }

        .history-item .h-verdict.real { color: var(--success); }
        .history-item .h-verdict.fake { color: var(--secondary); }

        .history-item .h-time {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .tabs { max-width: 100%; }
            .tab-btn { padding: 10px 16px; font-size: 0.85rem; }
            .result-card { padding: 20px; }
            .result-verdict .verdict-text { font-size: 1.2rem; }
            .result-confidence .confidence-value { font-size: 1.6rem; }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .upload-area { padding: 30px 20px; min-height: 200px; }
            .forensic-grid { grid-template-columns: repeat(2, 1fr); }
            .action-row .btn { flex: 1; min-width: 120px; }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .header h1 { font-size: 1.6rem; }
            .tab-btn { font-size: 0.75rem; padding: 8px 12px; }
            .tab-btn .icon { font-size: 1rem; }
            .result-header { flex-direction: column; align-items: flex-start; }
            .result-confidence { text-align: left; width: 100%; }
            .metrics-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .metric-item { padding: 12px; }
            .metric-item .metric-value { font-size: 1.1rem; }
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.4;
        }
    </style>
</head>
