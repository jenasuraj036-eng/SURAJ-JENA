<body class="flex items-center justify-center p-6">

    <div class="w-full max-w-4xl mx-auto card rounded-3xl p-6 md:p-8">

        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
            <div class="bg-blue-100 p-3 rounded-2xl text-blue-600">
                <i class="fas fa-image fa-lg"></i>
            </div>
            <div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Image Caption</h1>
                <p class="text-slate-500 text-sm">Upload an image &amp; get a descriptive AI caption</p>
            </div>
        </div>

        <!-- Main upload & preview area -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

            <!-- Left column: upload & preview -->
            <div class="space-y-5">

                <!-- Drop zone / file input -->
                <div id="dropZone" class="drop-zone rounded-2xl p-8 text-center cursor-pointer transition-all">
                    <div class="flex flex-col items-center gap-2">
                        <i class="fas fa-cloud-upload-alt text-4xl text-blue-400"></i>
                        <p class="text-slate-600 font-medium">Drop your image here, or</p>
                        <label for="fileInput" class="inline-block bg-blue-50 hover:bg-blue-100 text-blue-700 px-5 py-2 rounded-xl text-sm font-semibold transition cursor-pointer">
                            <i class="fas fa-folder-open mr-2"></i>Browse files
                        </label>
                        <input id="fileInput" type="file" accept="image/*" class="hidden">
                        <p class="text-xs text-slate-400 mt-1">JPG, PNG, WEBP, GIF (max 5MB)</p>
                    </div>
                </div>

                <!-- Image preview -->
                <div id="previewContainer" class="relative bg-white/50 rounded-2xl overflow-hidden border border-slate-200 hidden">
                    <img id="imagePreview" class="w-full h-auto max-h-64 object-contain p-2" src="./AI Image Caption Generator_files/IMAGE caption generator.html" alt="Preview">
                    <button id="removeImageBtn" class="absolute top-2 right-2 bg-white/80 hover:bg-red-50 text-slate-600 hover:text-red-600 p-2 rounded-full shadow-md transition text-sm">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Generate button -->
                <button id="generateBtn" disabled="" class="btn-primary w-full text-white font-semibold py-3 px-6 rounded-xl flex items-center justify-center gap-2 transition disabled:opacity-50">
                    <i class="fas fa-wand-magic-sparkles"></i> Generate Caption
                </button>
            </div>

            <!-- Right column: caption output -->
            <div class="bg-white/60 rounded-2xl p-6 border border-slate-200/80 flex flex-col">
                <div class="flex items-center gap-2 text-slate-600 mb-3">
                    <i class="fas fa-quote-right text-blue-400"></i>
                    <h2 class="font-semibold text-slate-700">Generated Caption</h2>
                </div>

                <!-- Caption display area -->
                <div id="captionOutput" class="caption-box flex-1 flex flex-col justify-center items-center text-slate-400 bg-slate-50/50 rounded-xl p-4">
                    <i class="fas fa-lightbulb text-3xl mb-2 opacity-40"></i>
                    <p class="text-sm text-center">Your caption will appear here</p>
                </div>

                <!-- Loading indicator (hidden by default) -->
                <div id="loadingIndicator" class="hidden mt-4 flex flex-col items-center gap-2">
                    <div class="spinner"></div>
                    <p class="text-sm text-slate-500">AI is thinking...</p>
                </div>

                <!-- Extra actions -->
                <div class="mt-4 flex flex-wrap gap-2 justify-end">
                    <button id="copyCaptionBtn" disabled="" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl transition flex items-center gap-1">
                        <i class="far fa-copy"></i> Copy
                    </button>
                    <button id="resetBtn" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl transition flex items-center gap-1">
                        <i class="fas fa-rotate-right"></i> Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer note -->
        <div class="mt-8 text-center text-xs text-slate-400 border-t border-slate-200/50 pt-4">
            <i class="fas fa-robot mr-1"></i> Powered by Hugging Face BLIP-base · Demo project
        </div>
    </div>

    <script>
        (function() {
            // DOM references
            const fileInput = document.getElementById('fileInput');
            const dropZone = document.getElementById('dropZone');
            const previewContainer = document.getElementById('previewContainer');
            const imagePreview = document.getElementById('imagePreview');
            const removeImageBtn = document.getElementById('removeImageBtn');
            const generateBtn = document.getElementById('generateBtn');
            const captionOutput = document.getElementById('captionOutput');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const copyCaptionBtn = document.getElementById('copyCaptionBtn');
            const resetBtn = document.getElementById('resetBtn');

            // State
            let currentImageFile = null;        // store the uploaded file
            let currentCaption = '';            // store last generated caption
            let isGenerating = false;

            // ---------- helper functions ----------
            function resetUI() {
                // clear image
                currentImageFile = null;
                previewContainer.classList.add('hidden');
                imagePreview.src = '#';
                // clear caption
                currentCaption = '';
                captionOutput.innerHTML = `
                    <i class="fas fa-lightbulb text-3xl mb-2 opacity-40"></i>
                    <p class="text-sm text-center">Your caption will appear here</p>
                `;
                generateBtn.disabled = true;
                copyCaptionBtn.disabled = true;
                // reset file input
                fileInput.value = '';
                // hide loading if visible
                loadingIndicator.classList.add('hidden');
                isGenerating = false;
                // remove dragover style
                dropZone.classList.remove('dragover');
            }

            // display the selected image
            function showImage(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                    generateBtn.disabled = false;
                };
                reader.readAsDataURL(file);
                currentImageFile = file;
                // clear old caption when new image loaded
                currentCaption = '';
                captionOutput.innerHTML = `
                    <i class="fas fa-lightbulb text-3xl mb-2 opacity-40"></i>
                    <p class="text-sm text-center">New image ready — generate caption</p>
                `;
                copyCaptionBtn.disabled = true;
            }

            // ---------- 1. File input change ----------
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    // simple size check (5MB)
                    if (file.size > 5 * 1024 * 1024) {
                        alert('Image size exceeds 5MB. Please choose a smaller file.');
                        fileInput.value = '';
                        return;
                    }
                    showImage(file);
                } else {
                    resetUI();
                }
            });

            // ---------- 2. Drag & Drop ----------
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const file = files[0];
                    if (!file.type.startsWith('image/')) {
                        alert('Please drop an image file.');
                        return;
                    }
                    if (file.size > 5 * 1024 * 1024) {
                        alert('Image size exceeds 5MB.');
                        return;
                    }
                    // update file input (for consistency)
                    fileInput.files = files;
                    showImage(file);
                }
            });

            // click on dropzone triggers file input
            dropZone.addEventListener('click', () => {
                fileInput.click();
            });

            // ---------- 3. Remove image ----------
            removeImageBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                resetUI();
            });

            // ---------- 4. Reset button ----------
            resetBtn.addEventListener('click', () => {
                resetUI();
            });

            // ---------- 5. Generate caption (API call) ----------
            generateBtn.addEventListener('click', async () => {
                if (isGenerating) return;
                if (!currentImageFile) {
                    alert('Please upload an image first.');
                    return;
                }

                // Disable button, show loading
                isGenerating = true;
                generateBtn.disabled = true;
                loadingIndicator.classList.remove('hidden');
                captionOutput.innerHTML = `
                    <div class="flex items-center gap-2 text-slate-400">
                        <i class="fas fa-spinner fa-pulse"></i>
                        <span>Generating...</span>
                    </div>
                `;
                copyCaptionBtn.disabled = true;

                try {
                    // Convert image to base64 (or blob) for API
                    const base64Image = await toBase64(currentImageFile);
                    // Use Hugging Face BLIP (image-to-text) via free inference API
                    const response = await fetch(
                        'https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-base',
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                // No API key required for public models with rate limits,
                                // but we add a dummy key to avoid CORS issues with some browsers
                                // (HF allows unauthenticated requests with limits)
                            },
                            body: JSON.stringify({ inputs: base64Image })
                        }
                    );

                    // Important: HF API sometimes returns 503 if model is loading, we handle that
                    if (!response.ok) {
                        let errorMsg = `API error (${response.status})`;
                        try {
                            const errData = await response.json();
                            if (errData && errData.error) errorMsg = errData.error;
                        } catch (_) { /* ignore */ }
                        throw new Error(errorMsg);
                    }

                    const data = await response.json();
                    // The response is an array with one object: [{ generated_text: "..." }]
                    let caption = '';
                    if (Array.isArray(data) && data.length > 0 && data[0].generated_text) {
                        caption = data[0].generated_text;
                    } else if (data.generated_text) {
                        caption = data.generated_text;
                    } else {
                        // fallback: if weird response
                        console.warn('Unexpected API response', data);
                        caption = 'A beautiful image. (fallback caption)';
                    }

                    currentCaption = caption;
                    // display caption
                    captionOutput.innerHTML = `
                        <div class="caption-result pl-4 py-1 w-full">
                            <p class="text-slate-700 text-base leading-relaxed">${escapeHtml(caption)}</p>
                        </div>
                    `;
                    copyCaptionBtn.disabled = false;

                } catch (error) {
                    console.error('Caption generation error:', error);
                    let friendlyMsg = 'Failed to generate caption. ';
                    if (error.message.includes('503')) {
                        friendlyMsg += 'The model is loading. Please wait a few seconds and try again.';
                    } else if (error.message.includes('429')) {
                        friendlyMsg += 'Too many requests. Please wait a moment.';
                    } else {
                        friendlyMsg += error.message || 'Unknown error.';
                    }
                    captionOutput.innerHTML = `
                        <div class="text-red-500 text-center p-2">
                            <i class="fas fa-exclamation-circle text-xl mb-1"></i>
                            <p class="text-sm">${escapeHtml(friendlyMsg)}</p>
                        </div>
                    `;
                } finally {
                    isGenerating = false;
                    generateBtn.disabled = false;
                    loadingIndicator.classList.add('hidden');
                }
            });

            // ---------- 6. Copy caption ----------
            copyCaptionBtn.addEventListener('click', () => {
                if (!currentCaption) return;
                navigator.clipboard.writeText(currentCaption).then(() => {
                    // visual feedback
                    const original = copyCaptionBtn.innerHTML;
                    copyCaptionBtn.innerHTML = `<i class="fas fa-check"></i> Copied!`;
                    setTimeout(() => {
                        copyCaptionBtn.innerHTML = original;
                    }, 1800);
                }).catch(() => {
                    alert('Unable to copy. You can manually select the text.');
                });
            });

            // ---------- 7. Helper: toBase64 ----------
            function toBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => {
                        // data:image/jpeg;base64,xxxxx  -> we need the base64 string
                        const base64String = reader.result.split(',')[1];
                        resolve(base64String);
                    };
                    reader.onerror = (error) => reject(error);
                });
            }

            // ---------- 8. Escape HTML (to prevent injection) ----------
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // ---------- 9. Init: ensure proper initial state ----------
            resetUI();

            // extra: if user drops on window (prevent default)
            document.addEventListener('dragover', (e) => e.preventDefault());
            document.addEventListener('drop', (e) => e.preventDefault());

        })();
    </script>
